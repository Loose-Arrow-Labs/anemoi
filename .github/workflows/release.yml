name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-artifacts:
    name: build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: anemoi-linux-x86_64
          - os: windows-latest
            artifact_name: anemoi-windows-x86_64
          - os: macos-latest
            artifact_name: anemoi-macos

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release -p anemoi-cli -p anemoi-daemon

      - name: Package artifacts
        shell: pwsh
        run: |
          $artifact = "${{ matrix.artifact_name }}"
          $root = "dist/$artifact"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item README.md $root/
          Copy-Item config/anemoi.example.yaml $root/

          if ($env:RUNNER_OS -eq "Windows") {
            Copy-Item target/release/anemoi.exe $root/
            Copy-Item target/release/anemoi-daemon.exe $root/
            Compress-Archive -Path "$root/*" -DestinationPath "dist/$artifact.zip" -Force
          } else {
            Copy-Item target/release/anemoi $root/
            Copy-Item target/release/anemoi-daemon $root/
            tar -czf "dist/$artifact.tar.gz" -C $root .
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.*
          if-no-files-found: error

  publish-release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
